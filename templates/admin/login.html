<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure access – Knowsoft</title>
  <link rel="icon" href="/static/img/knowsoft-logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-200 flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-xl shadow border border-slate-200 p-8">
    <div class="flex justify-center mb-6">
      <img src="/static/img/knowsoft-logo.png" alt="Knowsoft" class="h-12 w-auto object-contain">
    </div>
    <h1 class="text-lg font-semibold text-slate-800 mb-1 text-center">General Admin</h1>
    <p class="text-xs text-slate-500 text-center mb-6">Restricted portal · not linked from the public site</p>
    {% if error %}<div class="mb-4 text-sm text-red-600 bg-red-50 p-2 rounded">{{ error }}</div>{% endif %}
    <form method="post" action="/ks-admin/login" class="space-y-4">
      <div>
        <label class="text-xs font-medium text-slate-600">Email</label>
        <input type="email" name="email" required placeholder="admin@knowsoft.com" class="w-full mt-1 px-3 py-2.5 border rounded-lg text-sm">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-600">Password</label>
        <input type="password" name="password" required placeholder="Password" class="w-full mt-1 px-3 py-2.5 border rounded-lg text-sm">
      </div>
      <button class="w-full py-2.5 rounded-lg bg-slate-800 text-white text-sm font-medium">Sign in</button>
    </form>
  </div>
</body>
</html>
