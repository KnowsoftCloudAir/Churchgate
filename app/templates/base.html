<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Knowsoft Churchgate{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','system-ui','sans-serif']},colors:{navy:{800:'#243b53',900:'#102a43',950:'#0a1929'},teal:{400:'#2dd4bf',500:'#14b8a6',600:'#0d9488'}}}}}</script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="h-full bg-slate-50 font-sans text-navy-900 antialiased">
  {% if user %}
  <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/dashboard" class="flex items-center gap-2 font-bold">
        <img src="/static/img/knowsoft-logo.png" alt="Knowsoft" class="h-8 w-auto object-contain" onerror="this.style.display='none'">
        <span>Churchgate</span>
      </a>
      <div class="flex items-center gap-2 text-sm">
        <a href="/dashboard" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">Dashboard</a>
        <a href="/district/members" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">Members</a>
        <a href="/district/stats/enter" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">Enter Stats</a>
        <a href="/district/reports/pdf" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">PDF Report</a>
        {% if user.role in ['church_admin', 'general_admin'] %}
        <a href="/church/create-child" class="px-3 py-1.5 rounded-lg bg-teal-500 text-white">Add Sub-Church</a>
        {% endif %}
        <a href="/auth/logout" class="px-3 py-1.5 text-red-600">Sign out</a>
      </div>
    </div>
  </nav>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
