<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
  <div class="max-w-md text-center space-y-4">
    <h1 class="text-2xl font-bold">Thank you, {{ name }}</h1>
    <p class="text-teal-300 text-lg">Score: {{ score }}%</p>
    <a class="inline-block rounded-xl bg-amber-600 px-5 py-2 font-bold" href="/evaluate/{{ token }}/certificate?name={{ name|urlencode }}">Print certificate</a>
  </div>
</body>
</html>
