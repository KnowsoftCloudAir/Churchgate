<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watching — {{ presentation.title if presentation else 'Live' }}</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{height:100%;margin:0;background:#020617;color:#fff;overflow:hidden;}
    #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem 1.5rem 7rem;}
    .card{max-width:960px;width:100%;border-radius:1.25rem;padding:1.75rem;background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(15,23,42,.75));border:1px solid rgba(45,212,191,.35);}
    .chat{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(15,23,42,.95);border-top:1px solid rgba(255,255,255,.1);padding:.75rem;}
  </style>
</head>
<body>
  <div class="fixed top-3 left-3 text-xs text-teal-300 z-10">Live · {{ viewer.name }}</div>
  <div id="stage"></div>
  <div class="chat">
    <p class="text-[11px] text-slate-400 mb-1">Ask the host / Eleon a question</p>
    <div class="flex gap-2 max-w-3xl mx-auto">
      <input id="q" type="text" placeholder="Type your question…" class="flex-1 rounded-xl px-3 py-2 text-slate-900 text-sm">
      <button type="button" onclick="sendQ()" class="rounded-xl bg-teal-600 px-4 py-2 text-sm font-bold">Send</button>
    </div>
  </div>
  <script>
  const TOKEN = {{ token|tojson }};
  const NAME = {{ viewer.name|tojson }};
  let slides = [], idx = 0;
  function render(){
    const s = slides[idx] || {title:'Waiting for host…', body:''};
    document.getElementById('stage').innerHTML = `
      <div class="card">
        <p class="text-[10px] uppercase tracking-widest text-teal-300 mb-2">Knowsoft Eleon · Live</p>
        <h1 class="text-3xl sm:text-4xl font-black mb-3">${esc(s.title||'')}</h1>
        <div class="text-slate-200 text-lg whitespace-pre-wrap">${esc(s.body||'')}</div>
      </div>`;
  }
  function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  async function poll(){
    const r = await fetch('/api/live/'+TOKEN+'/state');
    const j = await r.json();
    if (!j.active) { document.getElementById('stage').innerHTML = '<p class="text-slate-400">Session ended.</p>'; return; }
    slides = j.slides || [];
    idx = Math.min(j.index||0, Math.max(0, slides.length-1));
    render();
  }
  async function sendQ(){
    const text = document.getElementById('q').value.trim();
    if (!text) return;
    await fetch('/api/join/'+TOKEN+'/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, name: NAME })
    });
    document.getElementById('q').value = '';
    document.getElementById('q').placeholder = 'Sent — waiting for Eleon…';
  }
  document.getElementById('q').addEventListener('keydown', e => { if (e.key==='Enter') sendQ(); });
  poll(); setInterval(poll, 2000);
  </script>
</body>
</html>
