<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Present — {{ presentation.title }} — Eleon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#020617;}
    .slide-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2.5rem 12rem 7rem 2rem;}
    @media(max-width:900px){.slide-stage{padding:1rem 1rem 8rem;}}
    .slide-card{max-width:920px;width:100%;border-radius:1.5rem;padding:2.25rem;transition:all .55s cubic-bezier(.22,1,.36,1);}
    .anim-fade{animation:fadeIn .55s ease;}
    .anim-slideLeft{animation:slideLeft .55s ease;}
    .anim-slideUp{animation:slideUp .55s ease;}
    .anim-zoom{animation:zoomIn .55s ease;}
    .anim-flip{animation:flipIn .6s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideLeft{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
    @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
    @keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
    @keyframes flipIn{from{opacity:0;transform:rotateY(25deg)}to{opacity:1;transform:none}}
    .side-enh{position:fixed;top:50%;right:.75rem;transform:translateY(-50%);z-index:40;width:9.5rem;display:flex;flex-direction:column;gap:.35rem;}
    .side-enh button{font-size:11px;text-align:left;padding:.45rem .55rem;border-radius:.65rem;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;}
    .side-enh button:hover{background:rgba(20,184,166,.25);border-color:rgba(45,212,191,.5);}
    .probe{position:fixed;bottom:.75rem;left:50%;transform:translateX(-50%);z-index:50;width:min(580px,94vw);}
    .probe-dot{width:10px;height:10px;border-radius:999px;background:#2dd4bf;box-shadow:0 0 12px #2dd4bf;animation:pulse 1.2s infinite;}
    .probe-dot.off{background:#64748b;box-shadow:none;animation:none;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  </style>
</head>
<body>
  <div class="fixed top-3 left-3 z-40 flex gap-2 text-xs items-center">
    {% if not shared %}
    <a href="/presentations/{{ presentation.id }}/edit" class="rounded-lg bg-black/40 text-white/80 px-2 py-1 border border-white/10">Exit</a>
    {% else %}
    <a href="/" class="rounded-lg bg-black/40 text-white/80 px-2 py-1 border border-white/10">Eleon</a>
    {% endif %}
    <span class="rounded-lg bg-black/40 text-teal-200 px-2 py-1 border border-white/10" id="counter">1 / {{ slides|length }}</span>
    <button type="button" id="micBtn" onclick="toggleListen()" class="rounded-lg bg-teal-700/80 text-white px-2 py-1 border border-teal-400/40">🎤 Voice</button>
  </div>
  <div class="fixed top-3 right-3 z-40 flex gap-1">
    <button type="button" onclick="go(-1)" class="rounded-lg bg-white/10 text-white px-3 py-1 text-sm">Prev</button>
    <button type="button" onclick="go(1)" class="rounded-lg bg-teal-600 text-white px-3 py-1 text-sm font-semibold">Next</button>
    <button type="button" onclick="startClosing()" class="rounded-lg bg-indigo-600 text-white px-3 py-1 text-sm">End + Q&A</button>
  </div>

  <div class="side-enh" id="sideEnh">
    <p class="text-[10px] uppercase tracking-wide text-teal-300/90 px-1 mb-1">Enhance</p>
    <button type="button" onclick="enhance('accent_teal')">Teal accent</button>
    <button type="button" onclick="enhance('accent_gold')">Gold accent</button>
    <button type="button" onclick="enhance('bg_indigo')">Indigo bg</button>
    <button type="button" onclick="enhance('anim_zoom')">Zoom in</button>
    <button type="button" onclick="enhance('anim_slide')">Slide in</button>
    <button type="button" onclick="enhance('anim_fade')">Fade</button>
    <button type="button" onclick="enhance('anim_flip')">Flip</button>
  </div>

  <div id="stage" class="slide-stage"></div>

  <div class="probe">
    <div class="rounded-2xl border border-white/15 bg-slate-900/90 backdrop-blur px-4 py-3 shadow-2xl">
      <div class="flex items-center gap-2 mb-2">
        <span class="probe-dot" id="probeDot"></span>
        <span class="text-teal-300 text-sm font-bold tracking-wide">ELEON</span>
        <span class="text-xs text-slate-400" id="probeStatus">say "Eleon" or type a command</span>
      </div>
      <div class="flex gap-2">
        <input id="cmd" type="text" placeholder='next · previous · go to slide 2 · end · or ask about the content'
               class="flex-1 rounded-xl px-3 py-2 text-slate-900 text-sm" autocomplete="off">
        <button type="button" onclick="askEleon()" class="rounded-xl bg-teal-600 px-3 py-2 text-sm font-bold text-white">Ask</button>
      </div>
      <p class="text-xs text-slate-300 mt-2 min-h-[1.25rem]" id="eleonReply"></p>
    </div>
  </div>

  <script>
  const SLIDES = [
    {% for s in slides %}
    {
      id: {{ s.id }},
      title: {{ (s.title or '')|tojson }},
      body: {{ (s.body or '')|tojson }},
      extra: {{ (s.extra_data or '')|tojson }},
      image: {{ (s.image_path or '')|tojson }},
      animIn: {{ (s.animation_in or 'fade')|tojson }},
      animOut: {{ (s.animation_out or 'fade')|tojson }},
      bg: {{ (s.bg_color or '#0f172a')|tojson }},
      accent: {{ (s.accent or '#14b8a6')|tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];
  const PID = {{ presentation.id }};
  const SHARED = {{ 'true' if shared else 'false' }};
  let idx = 0;
  let phase = 'present'; // present | closing_qa
  let eleonOn = true;
  let qaTimer = null;
  let recognizing = false;
  let recognition = null;

  function render() {
    const s = SLIDES[idx] || { title: 'Empty', body: '', bg: '#0f172a', accent: '#14b8a6', animIn: 'fade' };
    const stage = document.getElementById('stage');
    stage.style.background = `radial-gradient(ellipse at 30% 20%, ${s.accent}33, transparent 50%), ${s.bg}`;
    const anim = 'anim-' + (s.animIn || 'fade');
    stage.innerHTML = `
      <div class="slide-card ${anim} border shadow-2xl text-white" style="background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(15,23,42,.75));border-color:${s.accent}55">
        <p class="text-xs uppercase tracking-widest mb-2" style="color:${s.accent}">Eleon · Slide ${idx+1}</p>
        <h1 class="text-3xl sm:text-5xl font-black leading-tight mb-4">${escapeHtml(s.title)}</h1>
        <div class="text-base sm:text-lg text-slate-200 whitespace-pre-wrap leading-relaxed">${escapeHtml(s.body)}</div>
        ${s.image ? `<img src="${s.image}" class="mt-6 max-h-52 rounded-xl mx-auto shadow-lg border border-white/10" alt="">` : ''}
      </div>`;
    document.getElementById('counter').textContent = `${idx+1} / ${SLIDES.length || 1}`;
  }
  function escapeHtml(t) {
    return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function go(d) {
    if (phase === 'closing_qa') return;
    if (!SLIDES.length) return;
    idx = Math.max(0, Math.min(SLIDES.length - 1, idx + d));
    render();
  }
  function gotoSlide(i) {
    if (phase === 'closing_qa') return;
    if (i < 0 || i >= SLIDES.length) return;
    idx = i;
    render();
  }
  function speak(text, onend) {
    document.getElementById('eleonReply').textContent = text || '';
    if (!('speechSynthesis' in window) || !text) { if (onend) onend(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1;
    if (onend) u.onend = onend;
    window.speechSynthesis.speak(u);
  }
  function goOff() {
    eleonOn = false;
    document.getElementById('probeDot').classList.add('off');
    document.getElementById('probeStatus').textContent = 'Eleon is off';
    stopListen();
    if (qaTimer) { clearTimeout(qaTimer); qaTimer = null; }
  }
  function startClosing() {
    phase = 'closing_qa';
    // jump to thank-you slide if present
    const ti = SLIDES.findIndex(s => /thank you/i.test(s.title || ''));
    if (ti >= 0) { idx = ti; render(); }
    speak('Thank you for your attention. Any questions?', () => {
      document.getElementById('probeStatus').textContent = 'Q&A — waiting 1 minute…';
      if (qaTimer) clearTimeout(qaTimer);
      qaTimer = setTimeout(() => {
        speak('No further questions. Goodbye.', () => goOff());
      }, 60000);
    });
  }
  async function enhance(action) {
    if (SHARED) { speak('Enhancements need the presenter account.'); return; }
    const s = SLIDES[idx];
    if (!s || !s.id) return;
    const r = await fetch('/api/slides/' + s.id + '/enhance', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action })
    });
    const j = await r.json();
    if (j.ok && j.slide) {
      s.accent = j.slide.accent; s.bg = j.slide.bg_color;
      s.animIn = j.slide.animation_in; s.animOut = j.slide.animation_out;
      s.body = j.slide.body; s.extra = j.slide.extra_data;
      render();
      speak('Slide enhanced.');
    }
  }
  async function askEleon(qOverride) {
    if (!eleonOn && phase !== 'closing_qa') {
      document.getElementById('probeStatus').textContent = 'Eleon is off';
      return;
    }
    const q = (qOverride || document.getElementById('cmd').value).trim();
    if (!q) return;
    // wake word
    let question = q;
    const low = q.toLowerCase();
    if (low === 'eleon' || low === 'eleon!' ) {
      speak('Eleon is on and waiting.');
      document.getElementById('cmd').value = '';
      return;
    }
    if (low.startsWith('eleon ')) question = q.slice(6).trim();
    if (low.includes('turn off')) { speak('Eleon turning off.', () => goOff()); return; }

    document.getElementById('probeStatus').textContent = 'thinking…';
    try {
      const r = await fetch('/api/eleon/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ question, presentation_id: PID, slide_index: idx, phase })
      });
      const j = await r.json();
      if (j.action === 'next') go(1);
      else if (j.action === 'prev') go(-1);
      else if (j.action === 'goto' && typeof j.index === 'number') gotoSlide(j.index);
      else if (j.action === 'closing') startClosing();
      else if (j.action === 'enhance' && j.enhance) await enhance(j.enhance);
      else if (j.action === 'set_anim_in' && SLIDES[idx]) { await enhancePersistAnim('set_anim_in', j.value); }
      else if (j.action === 'set_anim_out' && SLIDES[idx]) { await enhancePersistAnim('set_anim_out', j.value); }

      speak(j.speak || '', () => {
        if (j.go_off) goOff();
        if (phase === 'closing_qa' && j.action === 'speak' && !j.go_off) {
          // reset 1-minute window after an answered question
          if (qaTimer) clearTimeout(qaTimer);
          qaTimer = setTimeout(() => {
            speak('No further questions. Goodbye.', () => goOff());
          }, 60000);
          document.getElementById('probeStatus').textContent = 'Q&A — waiting 1 minute…';
        }
      });
    } catch (e) {
      speak('Eleon could not reach the server.');
    }
    if (phase === 'present') document.getElementById('probeStatus').textContent = 'ready';
    document.getElementById('cmd').value = '';
  }
  async function enhancePersistAnim(action, value) {
    if (SHARED) return;
    const s = SLIDES[idx];
    if (!s || !s.id) return;
    const r = await fetch('/api/slides/' + s.id + '/enhance', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, value })
    });
    const j = await r.json();
    if (j.ok && j.slide) {
      s.animIn = j.slide.animation_in; s.animOut = j.slide.animation_out;
      render();
    }
  }
  function toggleListen() {
    if (recognizing) { stopListen(); return; }
    startListen();
  }
  function startListen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { speak('Voice recognition is not supported in this browser.'); return; }
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = (ev) => {
      const text = ev.results[ev.results.length - 1][0].transcript.trim();
      document.getElementById('cmd').value = text;
      document.getElementById('probeStatus').textContent = 'heard: ' + text;
      askEleon(text);
    };
    recognition.onerror = () => { recognizing = false; document.getElementById('micBtn').textContent = '🎤 Voice'; };
    recognition.onend = () => {
      if (recognizing && eleonOn) {
        try { recognition.start(); } catch(e) {}
      }
    };
    recognizing = true;
    recognition.start();
    document.getElementById('micBtn').textContent = '⏹ Stop';
    document.getElementById('probeStatus').textContent = 'listening…';
  }
  function stopListen() {
    recognizing = false;
    try { if (recognition) recognition.stop(); } catch(e) {}
    document.getElementById('micBtn').textContent = '🎤 Voice';
  }
  document.getElementById('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') askEleon(); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  });
  render();
  speak('Welcome to Eleon… your presentation partner.');
  </script>
</body>
</html>
