<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Present — {{ presentation.title }} — Eleon</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#020617;font-family:Inter,system-ui,sans-serif;}
    .slide-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4.5rem 11rem 7.5rem 2rem;perspective:1200px;}
    @media(max-width:900px){.slide-stage{padding:4.5rem 1rem 8.5rem;}}
    .slide-card{max-width:1000px;width:100%;border-radius:1.5rem;padding:2.25rem;transform-style:preserve-3d;box-shadow:0 25px 80px rgba(0,0,0,.45);}
    .anim-fade{animation:fadeIn .7s ease;}
    .anim-slideLeft{animation:slideLeft .7s cubic-bezier(.22,1,.36,1);}
    .anim-slideUp{animation:slideUp .7s cubic-bezier(.22,1,.36,1);}
    .anim-zoom{animation:zoomIn .7s cubic-bezier(.22,1,.36,1);}
    .anim-flip{animation:flipIn .85s cubic-bezier(.22,1,.36,1);}
    .anim-cube{animation:cubeIn .9s cubic-bezier(.22,1,.36,1);}
    .anim-float3d{animation:float3d .9s cubic-bezier(.22,1,.36,1);}
    .anim-rotateIn{animation:rotateIn .8s ease;}
    .anim-bounceIn{animation:bounceIn .85s cubic-bezier(.34,1.56,.64,1);}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideLeft{from{opacity:0;transform:translateX(80px) rotateY(-12deg)}to{opacity:1;transform:none}}
    @keyframes slideUp{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes zoomIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
    @keyframes flipIn{from{opacity:0;transform:rotateY(55deg)}to{opacity:1;transform:none}}
    @keyframes cubeIn{from{opacity:0;transform:rotateX(55deg) translateY(40px)}to{opacity:1;transform:none}}
    @keyframes float3d{from{opacity:0;transform:translateZ(-120px) rotateX(18deg)}to{opacity:1;transform:none}}
    @keyframes rotateIn{from{opacity:0;transform:rotate(-8deg) scale(.9)}to{opacity:1;transform:none}}
    @keyframes bounceIn{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
    .word{display:inline-block;opacity:0;animation:wordFadeUp .45s forwards;}
    .word.wa-fadeUp{animation-name:wordFadeUp;}
    .word.wa-cascade{animation-name:wordCascade;}
    .word.wa-typewriter{animation-name:wordType;}
    @keyframes wordFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes wordCascade{from{opacity:0;transform:rotateX(60deg)}to{opacity:1;transform:none}}
    @keyframes wordType{from{opacity:0}to{opacity:1}}
    .kw-hit{background:linear-gradient(90deg,#fbbf24,#34d399);-webkit-background-clip:text;color:transparent;font-weight:800;animation:kwPulse .6s ease;}
    @keyframes kwPulse{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
    .side-enh{position:fixed;top:50%;right:.6rem;transform:translateY(-50%);z-index:40;width:9.8rem;display:flex;flex-direction:column;gap:.3rem;max-height:70vh;overflow:auto;}
    .side-enh button{font-size:10px;text-align:left;padding:.4rem .5rem;border-radius:.6rem;background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;}
    .probe{position:fixed;bottom:.6rem;left:50%;transform:translateX(-50%);z-index:50;width:min(640px,96vw);}
    .probe-dot{width:11px;height:11px;border-radius:999px;background:#64748b;}
    .probe-dot.on{background:#2dd4bf;box-shadow:0 0 14px #2dd4bf;animation:pulse 1.1s infinite;}
    .probe-dot.listening{background:#fbbf24;box-shadow:0 0 16px #fbbf24;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .brand-bar{position:fixed;top:0;left:0;right:0;z-index:45;display:flex;align-items:center;gap:.5rem;padding:.5rem .85rem;background:linear-gradient(90deg,rgba(15,23,42,.95),rgba(30,27,75,.8));border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap;}
    .hide-ui .brand-bar,.hide-ui .side-enh,.hide-ui .probe{opacity:0;pointer-events:none;transition:opacity .4s;}
    .icon-pop{font-size:3rem;animation:bounceIn .8s ease;}
    .layout-split{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:center;}
    @media(max-width:700px){.layout-split{grid-template-columns:1fr;}}
    .img-frame{border-radius:1.25rem;overflow:hidden;border:1px solid rgba(255,255,255,.15);box-shadow:0 20px 50px rgba(0,0,0,.35);}
  
    .float-probe{
      position:fixed; left:1rem; bottom:1.2rem; z-index:48;
      width:56px; height:56px; border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.75); border:1px solid rgba(45,212,191,.35);
      box-shadow:0 8px 28px rgba(0,0,0,.35);
      animation:probeBob 2.8s ease-in-out infinite;
      cursor:pointer; transition: box-shadow .3s, transform .3s;
    }
    .float-probe img{width:34px;height:34px;border-radius:10px;}
    .float-probe.awake{
      animation:none;
      box-shadow:0 0 0 0 rgba(45,212,191,.7), 0 0 28px rgba(45,212,191,.55);
      animation:probeBlink 1.1s ease;
    }
    .float-probe.listening{
      box-shadow:0 0 22px rgba(251,191,36,.65);
      border-color:rgba(251,191,36,.6);
    }
    @keyframes probeBob{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-10px); }
    }
    @keyframes probeBlink{
      0%{ transform:scale(1); box-shadow:0 0 0 0 rgba(45,212,191,.6); }
      40%{ transform:scale(1.12); box-shadow:0 0 0 12px rgba(45,212,191,0); }
      100%{ transform:scale(1); }
    }
    .present-clean .probe-panel{display:none !important;}
    .music-tag{font-size:10px;color:#94a3b8;}

  </style>
</head>
<body class="present-clean">
  <div class="brand-bar">
    <img src="/static/img/knowsoft-logo.png" alt="Knowsoft" class="h-7" onerror="this.src='/static/icons/icon-192.png'">
    <span class="text-sm font-bold text-white hidden sm:inline">Eleon</span>
    <span class="rounded-lg bg-black/30 text-teal-200 px-2 py-0.5 text-xs border border-white/10" id="counter">1 / {{ slides|length }}</span>
    <select id="voiceSelect" class="text-xs rounded-lg px-1 py-1 text-slate-900 max-w-[9rem]" title="Voice"></select>
    <select id="langSelect" class="text-xs rounded-lg px-1 py-1 text-slate-900" title="Speech language">
      <option value="en-US">English</option>
      <option value="en-GB">English UK</option>
      <option value="fr-FR">French</option>
      <option value="es-ES">Spanish</option>
      <option value="pt-BR">Portuguese</option>
      <option value="de-DE">German</option>
      <option value="ar-SA">Arabic</option>
      <option value="hi-IN">Hindi</option>
      <option value="yo-NG">Yoruba*</option>
      <option value="ig-NG">Igbo*</option>
      <option value="ha-NG">Hausa*</option>
    </select>
    <div class="ml-auto flex flex-wrap gap-1 items-center">
      <button type="button" onclick="toggleFullscreen()" class="rounded-lg bg-indigo-600 text-white px-2 py-1 text-xs font-semibold">⛶ Fullscreen</button>
      <button type="button" id="autoBtn" onclick="toggleAutoplay()" class="rounded-lg bg-violet-700 text-white px-2 py-1 text-xs">▶ Auto-play</button>
      <button type="button" id="musicBtn" onclick="toggleMusic()" class="rounded-lg bg-slate-700 text-white px-2 py-1 text-xs">🎵 Music off</button>
      <select id="musicTrack" class="text-xs rounded-lg px-1 py-1 text-slate-900 max-w-[7rem]" title="Background music">
        <option value="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3">Lofi soft</option>
        <option value="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c9a47bfaa1.mp3?filename=calm-background-corporate-141590.mp3">Calm corporate</option>
        <option value="https://cdn.pixabay.com/download/audio/2021/08/09/audio_0625c1539c.mp3?filename=inspiring-cinematic-ambient-116199.mp3">Ambient</option>
        <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Soft instrumental</option>
      </select>
      <button type="button" onclick="startRecording()" class="rounded-lg bg-rose-700 text-white px-2 py-1 text-xs">⏺ Video</button>
      <button type="button" id="micBtn" onclick="toggleListen()" class="rounded-lg bg-slate-600 text-white px-2 py-1 text-xs font-semibold">🎤 Voice off</button>
      <button type="button" onclick="readCurrent()" class="rounded-lg bg-white/10 text-white px-2 py-1 text-xs">Read</button>
      <button type="button" onclick="go(-1)" class="rounded-lg bg-white/10 text-white px-2 py-1 text-xs">Prev</button>
      <button type="button" onclick="go(1)" class="rounded-lg bg-teal-600 text-white px-2 py-1 text-xs font-semibold">Next</button>
      <button type="button" onclick="startClosing()" class="rounded-lg bg-slate-700 text-white px-2 py-1 text-xs">End</button>
      {% if not shared %}
      <a href="/presentations/{{ presentation.id }}/edit" class="rounded-lg bg-black/40 text-white/80 px-2 py-1 text-xs border border-white/10">Exit</a>
      {% endif %}
    </div>
  </div>

  <div class="side-enh">
    <p class="text-[10px] uppercase text-teal-300/90 px-1">Enhance</p>
    <button type="button" onclick="setAnim('float3d')">3D float</button>
    <button type="button" onclick="setAnim('cube')">3D cube</button>
    <button type="button" onclick="setAnim('bounceIn')">Bounce</button>
    <button type="button" onclick="setAnim('zoom')">Zoom</button>
    <button type="button" onclick="setWordAnim('cascade')">Word cascade</button>
    <button type="button" onclick="setWordAnim('fadeUp')">Word fade-up</button>
    <button type="button" onclick="toggleKw()">Keyword anim</button>
    <button type="button" onclick="enhance('accent_gold')">Gold accent</button>
    <button type="button" onclick="enhance('bg_indigo')">Indigo bg</button>
  </div>

  <div id="stage" class="slide-stage"></div>

  <!-- Quiet bouncing probe (no panel noise in presentation mode) -->
  <button type="button" class="float-probe" id="floatProbe" title="Eleon — click to toggle voice" onclick="toggleListen()">
    <img src="/static/icons/icon-192.png" alt="Eleon">
  </button>
  <!-- Hidden command channel (keyboard "/" or voice) -->
  <div class="probe probe-panel" id="cmdPanel" style="display:none">
    <div class="rounded-2xl border border-white/15 bg-slate-900/92 backdrop-blur px-4 py-3 shadow-2xl">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-teal-300 text-sm font-bold">ELEON</span>
        <span class="text-xs text-slate-400" id="probeStatus">listening…</span>
      </div>
      <div class="flex gap-2">
        <input id="cmd" type="text" placeholder="Command or question"
               class="flex-1 rounded-xl px-3 py-2 text-slate-900 text-sm" autocomplete="off">
        <button type="button" onclick="askEleon()" class="rounded-xl bg-teal-600 px-3 py-2 text-sm font-bold text-white">Go</button>
      </div>
      <p class="text-xs text-slate-300 mt-2 min-h-[1.1rem]" id="eleonReply"></p>
    </div>
  </div>
  <audio id="bgMusic" loop preload="none"></audio>

  <script>
  const ICONS = {rocket:'🚀',chart:'📊',target:'🎯',star:'⭐',globe:'🌍',idea:'💡',team:'👥',growth:'📈',shield:'🛡️',heart:'💚',book:'📘',check:'✅'};
  const SLIDES = [
    {% for s in slides %}
    {
      id: {{ s.id }},
      title: {{ (s.title or '')|tojson }},
      body: {{ (s.body or '')|tojson }},
      extra: {{ (s.extra_data or '')|tojson }},
      notes: {{ (s.notes or '')|tojson }},
      image: {{ (s.image_path or '')|tojson }},
      onlineImage: {{ (s.online_image_url or '')|tojson }},
      animIn: {{ (s.animation_in or 'float3d')|tojson }},
      bg: {{ (s.bg_color or '#0f172a')|tojson }},
      accent: {{ (s.accent or '#14b8a6')|tojson }},
      layout: {{ (s.layout_style or 'title_body')|tojson }},
      icon: {{ (s.icon_name or '')|tojson }},
      chartType: {{ (s.chart_type or '')|tojson }},
      chartData: {{ (s.chart_data or '')|tojson }},
      keywordAnim: {{ 'true' if s.keyword_animation else 'false' }},
      wordAnim: {{ (s.word_animation or 'fadeUp')|tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];
  const PID = {{ presentation.id }};
  const SHARED = {{ 'true' if shared else 'false' }};

  let idx = 0, phase = 'present', eleonOn = true;
  let voiceEnabled = false;  // OFF by default — manual control
  let autoplay = false;
  let speaking = false;
  let speakToken = 0;
  let qaTimer = null, autoChain = null;
  let recognition = null, chartInst = null, mediaRecorder = null, recordedChunks = [];
  let keywordAnimOn = true;
  let selectedVoice = null;

  /* ---------- Voices ---------- */
  function loadVoices() {
    const sel = document.getElementById('voiceSelect');
    const voices = speechSynthesis.getVoices() || [];
    sel.innerHTML = '';
    if (!voices.length) {
      sel.innerHTML = '<option value="">Default voice</option>';
      return;
    }
    const lang = document.getElementById('langSelect').value.slice(0, 2);
    const sorted = [...voices].sort((a, b) => {
      const as = a.lang.startsWith(lang) ? 0 : 1;
      const bs = b.lang.startsWith(lang) ? 0 : 1;
      return as - bs || a.name.localeCompare(b.name);
    });
    sorted.forEach((v, i) => {
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = `${v.name} (${v.lang})`;
      o.dataset.name = v.name;
      o.dataset.lang = v.lang;
      sel.appendChild(o);
    });
    // store map on select
    sel._voices = sorted;
    const pref = sorted.find(v => v.lang.startsWith(document.getElementById('langSelect').value.slice(0,2)));
    if (pref) {
      sel.value = String(sorted.indexOf(pref));
      selectedVoice = pref;
    }
  }
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 200);
  document.getElementById('voiceSelect').addEventListener('change', function() {
    const list = this._voices || speechSynthesis.getVoices();
    selectedVoice = list[Number(this.value)] || null;
  });
  document.getElementById('langSelect').addEventListener('change', loadVoices);

  function fullSlideText(s) {
    // Read title + body clearly; include extra as continuation if present
    const parts = [];
    if (s.title) parts.push(s.title);
    if (s.body) parts.push(s.body);
    if (s.extra) parts.push(s.extra);
    return parts.join('. ').replace(/\s+/g, ' ').trim();
  }
  function escapeHtml(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function wordSpanHtml(text, wa) {
    if (!text || wa === 'none') return escapeHtml(text||'');
    return (text||'').split(/(\s+)/).map((w,i) => {
      if (/^\s+$/.test(w)) return w;
      return `<span class="word wa-${wa||'fadeUp'}" style="animation-delay:${Math.min(i*0.035,2)}s">${escapeHtml(w)}</span>`;
    }).join('');
  }
  function parseChart(s) {
    try { const j = JSON.parse(s.chartData||'{}'); if (j.labels&&j.values) return j; } catch(e){}
    const labels=[], values=[];
    (s.chartData||'').split(',').forEach(p => { const [a,b]=p.split(':'); if(a&&b){labels.push(a.trim());values.push(Number(b));}});
    return labels.length?{labels,values}:null;
  }
  function imgUrl(s){ return s.onlineImage || s.image || ''; }

  function render() {
    const s = SLIDES[idx] || {title:'Empty',body:'',bg:'#0f172a',accent:'#14b8a6',animIn:'fade',layout:'title_body',wordAnim:'fadeUp'};
    keywordAnimOn = s.keywordAnim !== false;
    const stage = document.getElementById('stage');
    const photo = imgUrl(s);
    if (s.layout === 'image_bg' && photo) {
      stage.style.backgroundImage = `linear-gradient(rgba(2,6,23,.72),rgba(2,6,23,.82)),url('${photo}')`;
      stage.style.backgroundSize = 'cover';
    } else {
      stage.style.backgroundImage = '';
      stage.style.background = `radial-gradient(ellipse at 25% 15%, ${s.accent}40, transparent 45%), ${s.bg}`;
    }
    const anim = 'anim-' + (s.animIn || 'float3d');
    const iconHtml = s.icon && ICONS[s.icon] ? `<div class="icon-pop mb-3">${ICONS[s.icon]}</div>` : '';
    const titleHtml = wordSpanHtml(s.title, s.wordAnim);
    const bodyHtml = wordSpanHtml(s.body, s.wordAnim);
    const chartBox = (s.chartType && parseChart(s)) ? `<div class="mt-4 h-52"><canvas id="slideChart"></canvas></div>` : '';
    let inner;
    if (s.layout === 'image_left' && photo) {
      inner = `<div class="layout-split"><div class="img-frame"><img src="${photo}" class="w-full max-h-72 object-cover"></div><div>${iconHtml}<h1 class="text-3xl font-black mb-3 text-white">${titleHtml}</h1><div class="text-slate-200 text-lg">${bodyHtml}</div>${chartBox}</div></div>`;
    } else if (s.layout === 'image_right' && photo) {
      inner = `<div class="layout-split"><div>${iconHtml}<h1 class="text-3xl font-black mb-3 text-white">${titleHtml}</h1><div class="text-slate-200 text-lg">${bodyHtml}</div>${chartBox}</div><div class="img-frame"><img src="${photo}" class="w-full max-h-72 object-cover"></div></div>`;
    } else if (s.layout === 'centered') {
      inner = `<div class="text-center text-white">${iconHtml}<h1 class="text-4xl font-black mb-4">${titleHtml}</h1><div class="text-lg text-slate-200 max-w-2xl mx-auto">${bodyHtml}</div>${chartBox}</div>`;
    } else {
      inner = `${iconHtml}<h1 class="text-3xl sm:text-5xl font-black text-white mb-4">${titleHtml}</h1><div class="text-lg text-slate-200 leading-relaxed">${bodyHtml}</div>${chartBox}${photo && s.layout!=='image_bg'?`<img src="${photo}" class="mt-5 max-h-48 rounded-xl">`:''}`;
    }
    stage.innerHTML = `<div class="slide-card ${anim} border text-white" style="background:linear-gradient(145deg,rgba(15,23,42,.9),rgba(15,23,42,.72));border-color:${s.accent}55">
      <div class="flex items-center gap-2 mb-2"><img src="/static/icons/icon-192.png" class="h-5 w-5 rounded"><span class="text-[10px] uppercase tracking-widest" style="color:${s.accent}">Knowsoft Eleon · ${idx+1}/${SLIDES.length}</span></div>
      ${inner}</div>`;
    document.getElementById('counter').textContent = `${idx+1} / ${SLIDES.length||1}`;
    if (chartInst) { try{chartInst.destroy()}catch(e){} chartInst=null; }
    const cd = parseChart(s);
    if (s.chartType && cd && document.getElementById('slideChart')) {
      chartInst = new Chart(document.getElementById('slideChart'), {
        type: s.chartType,
        data: { labels: cd.labels, datasets: [{ data: cd.values, backgroundColor: ['#14b8a6','#6366f1','#f59e0b','#f43f5e','#8b5cf6','#22d3ee'] }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#e2e8f0'}}},
          scales: (s.chartType==='pie'||s.chartType==='doughnut')?{}:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}} }
      });
    }
  }

  /** Smooth, single-utterance speech — waits until fully finished */
  function speak(text, onend) {
    return new Promise((resolve) => {
      const done = () => { speaking = false; if (musicOn && bgMusic) bgMusic.volume = 0.12; if (onend) onend(); resolve(); };
      document.getElementById('eleonReply').textContent = text || '';
      if (!text || !('speechSynthesis' in window)) { done(); return; }
      // Cancel only previous; one continuous utterance avoids choppy chunking
      window.speechSynthesis.cancel();
      speakToken++;
      const myToken = speakToken;
      speaking = true;
      if (musicOn && bgMusic) bgMusic.volume = 0.04;
      // Browser limit ~32k chars; keep reasonable length
      const clean = String(text).replace(/\s+/g, ' ').trim().slice(0, 3000);
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = document.getElementById('langSelect').value || 'en-US';
      u.rate = 0.92;
      u.pitch = 1;
      if (selectedVoice) u.voice = selectedVoice;
      u.onboundary = (ev) => {
        if (!keywordAnimOn || ev.name !== 'word') return;
        const spoken = clean.slice(0, ev.charIndex + (ev.charLength || 4));
        const last = spoken.split(/\s+/).pop();
        if (last && last.length > 3) highlightWord(last);
      };
      u.onend = () => { if (myToken === speakToken) done(); };
      u.onerror = () => { if (myToken === speakToken) done(); };
      // Chrome bug: pause/resume keeps speech alive on long text
      window.speechSynthesis.speak(u);
      const keepAlive = setInterval(() => {
        if (!speaking || myToken !== speakToken) { clearInterval(keepAlive); return; }
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }
      }, 10000);
    });
  }
  function stopSpeaking() {
    speakToken++;
    speaking = false;
    window.speechSynthesis.cancel();
  }
  function highlightWord(w) {
    const key = w.toLowerCase().replace(/[^\w]/g,'');
    document.querySelectorAll('.word').forEach(el => {
      const t = (el.textContent||'').toLowerCase().replace(/[^\w]/g,'');
      if (t && (t === key || t.includes(key) || key.includes(t))) {
        el.classList.add('kw-hit');
        setTimeout(() => el.classList.remove('kw-hit'), 700);
      }
    });
  }

  async function readCurrent() {
    wakeProbe();
    const s = SLIDES[idx];
    if (!s) return;
    const text = fullSlideText(s);
    if (!text) return;
    document.getElementById('probeStatus').textContent = 'reading slide…';
    await speak(text);
    if (eleonOn) document.getElementById('probeStatus').textContent = voiceEnabled ? 'listening…' : 'manual mode';
  }

  async function go(d) {
    if (phase === 'closing_qa') return;
    stopSpeaking();
    idx = Math.max(0, Math.min(SLIDES.length - 1, idx + d));
    render();
    // Only auto-read when autoplay is on
    if (autoplay && eleonOn) {
      await readCurrent();
      scheduleNextAfterSpeech();
    }
  }
  async function gotoSlide(i) {
    if (phase === 'closing_qa') return;
    if (i < 0 || i >= SLIDES.length) return;
    stopSpeaking();
    idx = i;
    render();
    if (autoplay && eleonOn) {
      await readCurrent();
      scheduleNextAfterSpeech();
    }
  }

  function scheduleNextAfterSpeech() {
    if (!autoplay) return;
    if (autoChain) clearTimeout(autoChain);
    // Small pause after speech ends, then next slide
    autoChain = setTimeout(async () => {
      if (!autoplay) return;
      if (idx >= SLIDES.length - 1) {
        toggleAutoplay(false);
        startClosing();
        return;
      }
      stopSpeaking();
      idx = Math.min(SLIDES.length - 1, idx + 1);
      render();
      await readCurrent();
      scheduleNextAfterSpeech();
    }, 900);
  }

  function toggleAutoplay(force) {
    if (typeof force === 'boolean') autoplay = force;
    else autoplay = !autoplay;
    document.getElementById('autoBtn').textContent = autoplay ? '⏸ Stop auto' : '▶ Auto-play';
    if (autoChain) clearTimeout(autoChain);
    if (autoplay) {
      document.getElementById('probeStatus').textContent = 'auto-play — finishing each slide before next';
      (async () => { await readCurrent(); scheduleNextAfterSpeech(); })();
    } else {
      stopSpeaking();
      document.getElementById('probeStatus').textContent = voiceEnabled ? 'listening…' : 'manual mode';
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(recordedChunks, { type:'video/webm' }));
        a.download = 'eleon_presentation.webm'; a.click();
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      await speak('Recording started.');
      stream.getVideoTracks()[0].onended = () => { if (mediaRecorder.state !== 'inactive') mediaRecorder.stop(); };
    } catch(e) { await speak('Screen recording not available.'); }
  }
  function setAnim(name){ if(SLIDES[idx]){ SLIDES[idx].animIn=name; render(); } }
  function setWordAnim(name){ if(SLIDES[idx]){ SLIDES[idx].wordAnim=name; render(); } }
  function toggleKw(){ keywordAnimOn=!keywordAnimOn; }
  async function enhance(action){
    if(SHARED)return;
    const s=SLIDES[idx]; if(!s||!s.id)return;
    const r=await fetch('/api/slides/'+s.id+'/enhance',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
    const j=await r.json();
    if(j.ok&&j.slide){ s.accent=j.slide.accent;s.bg=j.slide.bg_color;s.animIn=j.slide.animation_in;s.body=j.slide.body; render(); }
  }
  function goOff(){
    eleonOn=false; voiceEnabled=false; autoplay=false;
    stopSpeaking(); stopListen();
    document.getElementById('probeDot').className='probe-dot';
    document.getElementById('probeStatus').textContent='Eleon is off';
    document.getElementById('micBtn').textContent='🎤 Voice off';
    document.getElementById('autoBtn').textContent='▶ Auto-play';
  }
  async function startClosing(){
    phase='closing_qa'; autoplay=false;
    if(autoChain)clearTimeout(autoChain);
    const ti=SLIDES.findIndex(s=>/thank you/i.test(s.title||''));
    if(ti>=0){idx=ti;render();}
    if(mediaRecorder&&mediaRecorder.state==='recording') mediaRecorder.stop();
    await speak('Thank you for your attention. Any questions?');
    document.getElementById('probeStatus').textContent='Q&A — 1 minute';
    if(qaTimer)clearTimeout(qaTimer);
    qaTimer=setTimeout(async()=>{ await speak('No further questions. Goodbye.'); goOff(); },60000);
  }

  async function askEleon(qOverride){
    if(!eleonOn) return;
    wakeProbe();
    let q=(qOverride||document.getElementById('cmd').value).trim(); if(!q)return;
    const low=q.toLowerCase().replace(/^eleon[,\s]+/i,'').trim();
    if(['eleon','eleon!'].includes(q.toLowerCase())){
      await speak('Eleon is ready.');
      document.getElementById('cmd').value=''; return;
    }
    if(low.includes('turn off')){ await speak('Turning off.'); goOff(); return; }
    if(['read','read slide','read the slide'].includes(low)){ document.getElementById('cmd').value=''; await readCurrent(); return; }
    if(low.includes('full screen')||low==='fullscreen'){ toggleFullscreen(); document.getElementById('cmd').value=''; return; }
    if(low.includes('auto play')||low==='autoplay'){ toggleAutoplay(); document.getElementById('cmd').value=''; return; }

    document.getElementById('probeStatus').textContent='thinking…';
    try {
      const r=await fetch('/api/eleon/ask',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
        body:JSON.stringify({question:low||q,presentation_id:PID,slide_index:idx,phase})});
      const j=await r.json();
      if(j.action==='next') await go(1);
      else if(j.action==='prev') await go(-1);
      else if(j.action==='goto'&&typeof j.index==='number') await gotoSlide(j.index);
      else if(j.action==='closing') await startClosing();
      else if(j.action==='read') await readCurrent();
      if(j.speak) {
        await speak(j.speak);
        if(j.go_off) goOff();
        if(phase==='closing_qa'&&!j.go_off){
          if(qaTimer)clearTimeout(qaTimer);
          qaTimer=setTimeout(async()=>{ await speak('No further questions. Goodbye.'); goOff(); },60000);
        }
      }
    } catch(e) { await speak('I could not reach the server.'); }
    document.getElementById('probeStatus').textContent = voiceEnabled ? 'listening…' : 'manual mode';
    document.getElementById('cmd').value='';
  }

  function toggleListen(){
    const fp = document.getElementById('floatProbe');
    const mic = document.getElementById('micBtn');
    if(voiceEnabled){
      voiceEnabled=false; stopListen();
      if(mic){ mic.textContent='🎤 Voice off'; mic.classList.remove('bg-teal-700'); mic.classList.add('bg-slate-600'); }
      fp.classList.remove('listening');
      const st=document.getElementById('probeStatus'); if(st) st.textContent='manual mode';
    } else {
      voiceEnabled=true; startListen();
      if(mic){ mic.textContent='⏹ Voice on'; mic.classList.add('bg-teal-700'); mic.classList.remove('bg-slate-600'); }
      fp.classList.add('listening');
      wakeProbe();
      const st=document.getElementById('probeStatus'); if(st) st.textContent='listening…';
    }
  }
  function startListen(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ document.getElementById('probeStatus').textContent='Voice not supported — type instead'; return; }
    recognition=new SR();
    recognition.lang=document.getElementById('langSelect').value||'en-US';
    recognition.continuous=true; recognition.interimResults=false;
    recognition.onresult=ev=>{
      if(!voiceEnabled)return;
      const text=ev.results[ev.results.length-1][0].transcript.trim();
      if(!text)return;
      document.getElementById('floatProbe')?.classList.add('listening'); wakeProbe();
      askEleon(text);
      setTimeout(()=>document.getElementById('floatProbe')?.classList.remove('listening'),800);
    };
    recognition.onend=()=>{ if(voiceEnabled&&eleonOn) try{recognition.start();}catch(e){} };
    try{recognition.start();}catch(e){}
  }
  function stopListen(){ try{recognition&&recognition.stop()}catch(e){} recognition=null; }

  document.getElementById('cmd').addEventListener('keydown',e=>{ if(e.key==='Enter')askEleon(); });
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); go(1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
    if(e.key==='f'||e.key==='F') toggleFullscreen();
    if(e.key==='r'||e.key==='R') readCurrent();
    if(e.key==='/'){ e.preventDefault(); const p=document.getElementById('cmdPanel'); p.style.display=p.style.display==='none'?'block':'none'; document.getElementById('cmd')?.focus(); }
  });

  render();
  const st0=document.getElementById('probeStatus'); if(st0) st0.textContent='quiet present mode';
  // silent start — probe bounces quietly; no ask panel
  </script>
</body>
</html>
