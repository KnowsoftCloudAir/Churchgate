<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleon — Your presentation partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes rise { from { opacity:0; transform:translateY(24px) scale(.98);} to { opacity:1; transform:none;} }
    @keyframes glow { 0%,100%{box-shadow:0 0 40px rgba(20,184,166,.35);} 50%{box-shadow:0 0 70px rgba(99,102,241,.45);} }
    .splash-card { animation: rise .9s ease-out both, glow 3s ease-in-out infinite; }
    .brand { letter-spacing: .2em; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white flex items-center justify-center p-6">
  <div class="splash-card max-w-lg w-full rounded-3xl border border-white/10 bg-slate-900/80 backdrop-blur-xl p-10 text-center">
    <p class="text-xs uppercase tracking-[0.35em] text-teal-300/90 mb-3">Knowsoft · Churchgate family</p>
    <h1 class="brand text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-cyan-200 to-indigo-300">ELEON</h1>
    <p class="mt-4 text-lg text-slate-200">Welcome to Eleon… your presentation partner</p>
    <p class="mt-2 text-sm text-slate-400">Design stunning slides. Let Eleon present and answer from your content.</p>
    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
      {% if user %}
      <a href="/dashboard" class="rounded-xl bg-teal-600 hover:bg-teal-500 px-6 py-3 font-bold">Open dashboard</a>
      {% else %}
      <a href="/login" class="rounded-xl bg-teal-600 hover:bg-teal-500 px-6 py-3 font-bold">Sign in</a>
      <a href="/register" class="rounded-xl border border-white/20 hover:bg-white/5 px-6 py-3 font-semibold">Register</a>
      {% endif %}
    </div>
  </div>
  <script>
    // Brief splash then optional auto-advance for logged-in users is intentional stay
  </script>
</body>
</html>
