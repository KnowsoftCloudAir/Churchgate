<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Eleon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <form method="post" action="/login" class="w-full max-w-md rounded-3xl border border-white/10 bg-slate-900/90 p-8 space-y-4">
    <a href="/" class="text-teal-300 text-sm">← Eleon</a>
    <h1 class="text-2xl font-bold">Sign in</h1>
    {% if error %}<p class="text-rose-400 text-sm">{{ error }}</p>{% endif %}
    <input name="email" type="email" required placeholder="Email" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <input name="password" type="password" required placeholder="Password" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <input name="login_number" placeholder="Login number (after approval)" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <button class="w-full rounded-xl bg-teal-600 hover:bg-teal-500 py-2.5 font-bold">Enter Eleon</button>
    <p class="text-sm text-slate-400">No account? <a href="/register" class="text-teal-300">Register</a></p>
  </form>
</body>
</html>
