{% extends "base.html" %}
{% block title %}Sign In – Churchgate{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-navy-950 to-teal-900 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
    <h1 class="text-2xl font-bold text-navy-900 mb-1">Sign in</h1>
    <p class="text-sm text-slate-500 mb-6">Knowsoft Churchgate</p>
    {% if error %}<div class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/login" class="space-y-4">
      <input type="email" name="email" required placeholder="Email" class="w-full px-4 py-3 rounded-xl border border-slate-200">
      <input type="password" name="password" required placeholder="Password" class="w-full px-4 py-3 rounded-xl border border-slate-200">
      <button class="w-full py-3 rounded-xl bg-teal-500 text-white font-semibold">Sign In</button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-500"><a href="/auth/register-church" class="text-teal-600">Register a church</a></p>
  </div>
</div>
{% endblock %}
