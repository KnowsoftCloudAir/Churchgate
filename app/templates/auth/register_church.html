{% extends "base.html" %}
{% block title %}Register Church – Churchgate{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-navy-950 to-teal-900 px-4 py-12">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-2xl p-8">
    <h1 class="text-2xl font-bold text-navy-900 mb-2">Register Your Church</h1>
    <p class="text-sm text-slate-500 mb-6">Admin will review and send approval + login details to your email.</p>
    {% if error %}<div class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/register-church" class="space-y-4" x-data="{ level: 'global' }">
      <div>
        <label class="block text-sm font-medium mb-1">Church Name *</label>
        <input name="name" required class="w-full px-4 py-3 rounded-xl border">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Level / Status *</label>
        <select name="level" x-model="level" class="w-full px-4 py-3 rounded-xl border">
          <option value="global">Global Church (brand new denomination root)</option>
          <option value="country">Country Church</option>
          <option value="state">State Church</option>
          <option value="group">Group Church</option>
          <option value="district">District Church</option>
        </select>
      </div>
      <div class="grid sm:grid-cols-2 gap-4" x-show="level !== 'global'">
        <div>
          <label class="block text-sm font-medium mb-1">Global Church Code *</label>
          <input name="global_code" class="w-full px-4 py-3 rounded-xl border" placeholder="e.g. CG-XXXXXX">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Country Code</label>
          <input name="country_code" class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">State Code</label>
          <input name="state_code" class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Group Code</label>
          <input name="group_code" class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">District Code</label>
          <input name="district_code" class="w-full px-4 py-3 rounded-xl border">
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Country Name</label>
          <input name="country_name" class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">State Name</label>
          <input name="state_name" class="w-full px-4 py-3 rounded-xl border">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Doctrine / Statement of Faith</label>
        <textarea name="doctrine" rows="2" class="w-full px-4 py-3 rounded-xl border"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Days of Activities</label>
        <input name="activity_days" placeholder="e.g. Sunday, Wednesday, Friday" class="w-full px-4 py-3 rounded-xl border">
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Owner Name *</label>
          <input name="owner_name" required class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Resident Pastor *</label>
          <input name="resident_pastor" required class="w-full px-4 py-3 rounded-xl border">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Address</label>
        <input name="address" class="w-full px-4 py-3 rounded-xl border">
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Phone</label>
          <input name="phone" class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Email (for approval & login) *</label>
          <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border">
        </div>
      </div>
      <hr class="border-slate-100">
      <p class="text-sm font-medium text-navy-700">Admin account for this church</p>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Admin Full Name *</label>
          <input name="admin_full_name" required class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Admin Password *</label>
          <input type="password" name="admin_password" required minlength="6" class="w-full px-4 py-3 rounded-xl border">
        </div>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-teal-500 text-white font-semibold">Submit for Approval</button>
    </form>
  </div>
</div>
{% endblock %}
