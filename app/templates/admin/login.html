<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churchgate Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-slate-900 border border-white/10 rounded-2xl p-8 text-white">
    <h1 class="text-xl font-bold mb-1">Knowsoft Churchgate</h1>
    <p class="text-sm text-slate-400 mb-6">General Admin Portal (restricted)</p>
    {% if error %}<div class="mb-4 p-3 bg-red-500/10 text-red-300 text-sm rounded-lg">{{ error }}</div>{% endif %}
    <form method="post" action="/ks-admin/login" class="space-y-4">
      <input type="email" name="email" required placeholder="Admin email" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-white/10">
      <input type="password" name="password" required placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-white/10">
      <button class="w-full py-3 rounded-xl bg-teal-500 text-slate-950 font-semibold">Sign in</button>
    </form>
  </div>
</body>
</html>
